version: "1.0"
name: pnpm-monorepo
description: pnpm workspace + Turborepo full-stack Monorepo template (Vite + React + Express + TypeScript)
variables:
  enabled: true
  delimiter: "%"
  filePatterns:
    mode: include
    patterns:
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "apps/web/index.html"
      - "apps/web/package.json"
      - "apps/web/tsconfig.json"
      - "apps/web/src/App.tsx"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/api/src/index.ts"
      - "packages/ui/package.json"
      - "packages/ui/tsconfig.json"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - "packages/tsconfig/package.json"
  inquirerQuestions:
    - name: projectName
      type: input
      message: Project name (root package.json name)
      default: demo-monorepo
      required: true
    - name: scope
      type: input
      message: npm scope for internal packages (e.g. @demo; package names look like @demo/ui)
      default: "@demo"
      required: false
    - name: description
      type: input
      message: Project description
      default: A full-stack monorepo
      required: false
    - name: author
      type: input
      message: Author
      default: ""
      required: false
hooks:
  after_write:
    scriptType: shell
    script: 'git init && git add -A && git commit -m "chore: init project from template"'
    errorHandling: warn
market:
  slug: pnpm-monorepo
  name: pnpm Monorepo 全栈模板
  summary: 基于 pnpm workspace 与 Turborepo 的全栈 TypeScript Monorepo 脚手架
  description: |
    一套开箱即用的全栈 Monorepo 工程化模板，基于 **pnpm workspace + Turborepo**：

    - `apps/web`：Vite + React + TypeScript 前端应用，内置 `/api` 代理
    - `apps/api`：Node + Express + TypeScript 轻量 HTTP 服务（端口 3001）
    - `packages/ui`：React 共享组件库（tsup 构建，ESM + CJS 双产物）
    - `packages/shared`：共享工具函数与类型定义
    - `packages/tsconfig`：共享 tsconfig 基座，统一编译约束

    内置 Turborepo 构建缓存与 build / lint / test / dev 管道，根目录统一 ESLint（flat config）+ Prettier 配置，适合中大型团队协作的全栈项目起步。
  category: 工程化
  tags:
    - Monorepo
    - pnpm
    - Turborepo
    - TypeScript
    - React
  version: 1.0.0
  gitUrl: https://github.com/agilebuilder/template-monorepo-pnpm-turbo-fullstack.git
  defaultBranch: main
  englishMetadata:
    name: pnpm full-stack monorepo
    summary: TypeScript full-stack workspace managed by pnpm and Turborepo.
    description: A workspace with Vite/React web and Express API apps, shared UI and
      utility packages, reusable TypeScript configuration, and Turborepo
      build/lint/test tasks. Internal dependencies use workspace links.
    category: Engineering
    tags:
      - Monorepo
      - pnpm
      - Turborepo
      - TypeScript
      - React
