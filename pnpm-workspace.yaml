packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ blocks dependency install scripts by default. esbuild is a runtime
# dependency of Vite/tsup/tsx, so its postinstall must be allowed.
# allowBuilds is the pnpm 11 syntax; onlyBuiltDependencies is compatible with pnpm 9/10.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
